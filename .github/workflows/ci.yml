name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      # docs/ and manifest-github-pages.xml are generated from src/ and manifest.xml.
      - name: Check the hosted build is up to date
        run: |
          npm run build:site
          git diff --exit-code
